<style>

}

#question{

}

    display:block;
    width:100%;
    margin:10px 0;

    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#333;
    color:white;
}

.option:hover{
    background:#00c3ff;

}

#timer{

    color:yellow;
}

#result{
    margin-top:10px;

}

.score{

    margin-top:10px;
}

.correct{color:lime;}
.wrong{color:red;}

<body>

<div class="container">

<h1>🔥 Ultimate Vocabulary Quiz</h1>

<div id="timer">30</div>

<div id="question"></div>
<div id="options"></div>

<div id="result"></div>

<div class="score">Score: <span id="score">0</span></div>

<button onclick="restartGame()" style="padding:10px 20px;margin-top:15px;">
Restart Game 🔄
</button>

</div>

<script>

function playSound(type){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = "sine";
    osc.frequency.value = type === "correct" ? 750 : 180;

    gain.gain.value = 0.1;

    osc.start();
    setTimeout(()=>osc.stop(),200);
}

let score = 0;
let current;
let timer;
let time = 30;
let remaining = [...words];

function startTimer(){
    clearInterval(timer);
    time = 30;

    timer = setInterval(()=>{
        time--;
        document.getElementById("timer").innerText = time;

        if(time <= 0){
            clearInterval(timer);
            showAnswer(false);
        }
    },1000);
}

function nextWord(){

    if(remaining.length === 0){
        document.getElementById("question").innerHTML =
            "🎉 Game Finished!";
        document.getElementById("options").innerHTML = "";
        return;
    }

    startTimer();

    const index = Math.floor(Math.random()*remaining.length);
    current = remaining.splice(index,1)[0];

    document.getElementById("question").innerText =
        `Meaning of: "${current.english}"`;

    let options = [current.arabic];

    while(options.length < 4){
        let r = words[Math.floor(Math.random()*words.length)].arabic;
        if(!options.includes(r)) options.push(r);
    }

    options.sort(()=>Math.random()-0.5);

    const box = document.getElementById("options");
    box.innerHTML = "";
    document.getElementById("result").innerHTML = "";

    options.forEach(opt=>{
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = opt;
        btn.onclick = ()=>showAnswer(opt === current.arabic);
        box.appendChild(btn);
    });
}

function showAnswer(correct){

    clearInterval(timer);

    if(correct){
        score++;
        playSound("correct");
        document.getElementById("result").innerHTML =
            `✅ Correct! = ${current.arabic}`;
        document.getElementById("result").className = "correct";
    }else{
        playSound("wrong");
        document.getElementById("result").innerHTML =
            `❌ Correct answer: ${current.arabic}`;
        document.getElementById("result").className = "wrong";
    }

    document.getElementById("score").innerText = score;

    setTimeout(nextWord,1200);
}

function restartGame(){
    score = 0;
    remaining = [...words];
    document.getElementById("score").innerText = 0;
    nextWord();
}

nextWord();

</script>
